name: CI

# A branch's pushes are checked through its pull request, master's as they land: a pull request's
# push would otherwise run twice.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A pull request's new push cancels the run of its previous one; master's runs all finish, each
# comparing its push's pages with the commit before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the visual comparison's base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The unit and component tests, failing below the coverage thresholds in `vite.config.ts`.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build
      # The browsers are kept between runs, by the installed Playwright version; the system
      # libraries they need are installed each time, apt's packages not being cached.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      # Reports the printed pages this push to master or pull request changes, against the commit before it
      # (or the pull request's base), without failing the build: a change of look may be meant.
      - name: Visual changes
        id: visual
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with (a new branch)."
            exit 0
          fi
          scripts/visual-diff.sh "$BASE"
      # A failed e2e test's trace, or each changed page's expected, actual and diff images; nothing
      # when an earlier step failed.
      - uses: actions/upload-artifact@v7
        if: always() && (failure() || steps.visual.outcome == 'failure')
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
