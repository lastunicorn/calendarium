name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Writes the build to the release as an asset.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, so the commit can be checked against master
          # and its release tag.
          fetch-depth: 0

      - name: Validate release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Only a released version is deployed, manual runs included: the
          # commit must carry the tag of the version in package.json.
          expected_tag="v$(node -p "require('./package.json').version")"
          stable_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$expected_tag" =~ $stable_tag_pattern ]]; then
            echo "Expected package.json to hold a stable MAJOR.MINOR.PATCH version, got '$expected_tag'."
            exit 1
          fi

          if [ "$EVENT_NAME" = "release" ] && [ "$TAG_NAME" != "$expected_tag" ]; then
            echo "Release tag '$TAG_NAME' does not match the package.json version '$expected_tag'."
            exit 1
          fi

          if ! git tag --points-at "$GITHUB_SHA" | grep -qx "$expected_tag"; then
            echo "Commit $GITHUB_SHA is not tagged $expected_tag; publish a release instead of deploying an unreleased commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Commit $GITHUB_SHA is not on master; only master is deployed."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Attach the build to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Pages artifact expires after a day; a release asset stays, so
          # every released version can still be downloaded and served locally.
          # A manual run attaches it too, replacing the asset, if the release
          # of its tag exists.
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            echo "No release for $tag; nothing to attach."
            exit 0
          fi
          archive="$(node -p "require('./package.json').name")-$version.zip"
          (cd dist && zip -qr "../$archive" .)
          gh release upload "$tag" "$archive" --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
