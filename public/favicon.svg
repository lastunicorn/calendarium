<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<title>Printable Calendar</title>
	<!-- Paper sheet with a folded bottom-right corner -->
	<path d="M10 12h44a4 4 0 0 1 4 4v30L44 60H10a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
	<path d="M58 46H48a4 4 0 0 0-4 4v10z" fill="#e0e0e0" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
	<!-- Header band -->
	<path d="M10 12h44a4 4 0 0 1 4 4v8H6v-8a4 4 0 0 1 4-4z" fill="#666" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
	<!-- Binder rings -->
	<rect x="17" y="4" width="6" height="14" rx="3" fill="#222"/>
	<rect x="41" y="4" width="6" height="14" rx="3" fill="#222"/>
	<!-- Day grid -->
	<g fill="#999">
		<rect x="12" y="30" width="7" height="6" rx="1"/>
		<rect x="23" y="30" width="7" height="6" rx="1"/>
		<rect x="34" y="30" width="7" height="6" rx="1"/>
		<rect x="12" y="40" width="7" height="6" rx="1"/>
		<rect x="23" y="40" width="7" height="6" rx="1"/>
		<rect x="12" y="50" width="7" height="6" rx="1"/>
		<rect x="23" y="50" width="7" height="6" rx="1"/>
	</g>
	<g fill="#222">
		<rect x="45" y="30" width="7" height="6" rx="1"/>
		<rect x="34" y="40" width="7" height="6" rx="1"/>
	</g>
</svg>
